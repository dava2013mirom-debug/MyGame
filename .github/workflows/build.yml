name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 360
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;33.0.0 platforms;android-31'

      - name: Build with Buildozer
        run: |
          buildozer -v android debug
          if [ ! -f bin/*.apk ]; then buildozer -v android debug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatchCircles-APK
          path: bin/*.apk