name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 360
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Pre-accept Android Licenses
        run: |
          export ANDROID_HOME="/opt/android"
          mkdir -p $ANDROID_HOME
          export CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          wget -q -O cmdline-tools.zip $CMDLINE_TOOLS_URL
          unzip -q cmdline-tools.zip -d $ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/bin:$PATH
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true

      - name: Build with Buildozer
        run: |
          buildozer -v android debug
          if [ ! -f bin/*.apk ]; then buildozer -v android debug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatchCircles-APK
          path: bin/*.apk